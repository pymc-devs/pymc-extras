name: pymc-extras
channels:
- conda-forge
- nodefaults
dependencies:
  - scikit-learn
  - better-optimize>=0.5.1,<1.0
  - dask<2025.1.1
  - xhistogram
  - statsmodels
  # numba 0.67 types pytensor's Cholesky output as readonly for readonly inputs, so the in-place
  # zeroing fails to compile. Fixed in pymc-devs/pytensor#2558, which no release contains yet.
  - numba<0.67
  # conda-forge's scipy 1.18.1 is built with Cython 3.3, whose fused-function names no longer
  # match the __pyx_capi__ keys pytensor's numba backend looks up (KeyError in _available_impls).
  - scipy<1.18.1
  - pytest
  - pytest-cov
  - pandas>=2.2,<3.2
  - pydantic>=2.0.0,<3.0
  - h5netcdf
  - pymc>=6.3.0,<6.4
  - pytensor>=3.3.0,<3.4
  - arviz>=1.2,<2.0
  - preliz>=0.27,<0.29
  - pip
  - pip:
      - jax
      - blackjax
